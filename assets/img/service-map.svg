<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Сервисная карта автомобиля Смарт</title>
  <desc id="desc">Аккуратная схема маршрута ремонта: симптом, диагностика, смета, согласование и ремонт.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1720"/>
      <stop offset="1" stop-color="#12243f"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#00a676"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="720" height="420" rx="30" fill="url(#bg)"/>
  <g opacity="0.16" stroke="#bfdbfe" stroke-width="1">
    <path d="M70 0v420M170 0v420M270 0v420M370 0v420M470 0v420M570 0v420M670 0v420"/>
    <path d="M0 70h720M0 150h720M0 230h720M0 310h720M0 390h720"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="48" y="46" width="624" height="328" rx="28" fill="#ffffff"/>
    <rect x="72" y="70" width="576" height="56" rx="18" fill="#f6f8fa"/>
    <circle cx="102" cy="98" r="9" fill="#00a676"/>
    <text x="124" y="104" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#111827">Сервисный маршрут Смарт</text>
    <text x="503" y="104" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#2563eb">Ногинск</text>
  </g>

  <g font-family="Arial, sans-serif">
    <g transform="translate(84 150)">
      <rect x="0" y="0" width="250" height="152" rx="24" fill="#eff6ff" stroke="#bfdbfe"/>
      <path d="M44 84c12-28 34-42 66-42h30c32 0 55 14 68 42" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round"/>
      <path d="M68 84h118" stroke="#2563eb" stroke-width="7" stroke-linecap="round"/>
      <circle cx="82" cy="96" r="14" fill="#0f1720"/>
      <circle cx="174" cy="96" r="14" fill="#0f1720"/>
      <rect x="30" y="20" width="82" height="30" rx="15" fill="#ffffff"/>
      <text x="46" y="40" font-size="13" font-weight="400" fill="#111827">симптом</text>
      <text x="30" y="132" font-size="15" font-weight="400" fill="#111827">Сначала понимаем, что происходит</text>
    </g>

    <g transform="translate(372 150)">
      <rect x="0" y="0" width="264" height="152" rx="24" fill="#f8fafc" stroke="#dbe3ee"/>
      <g transform="translate(28 28)">
        <circle cx="24" cy="24" r="24" fill="url(#blue)"/>
        <path d="M13 25l8 8 15-18" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="66" y="19" font-size="15" font-weight="400" fill="#111827">Диагностика</text>
        <text x="66" y="42" font-size="13" font-weight="400" fill="#64748b">ищем причину, не гадаем</text>
      </g>
      <g transform="translate(28 88)">
        <circle cx="24" cy="24" r="24" fill="#f59e0b"/>
        <path d="M14 22h20M14 31h14" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
        <text x="66" y="19" font-size="15" font-weight="400" fill="#111827">Смета</text>
        <text x="66" y="42" font-size="13" font-weight="400" fill="#64748b">согласуем до ремонта</text>
      </g>
    </g>

    <g transform="translate(112 330)">
      <rect width="496" height="34" rx="17" fill="#0f1720"/>
      <circle cx="24" cy="17" r="6" fill="#00a676"/>
      <text x="44" y="22" font-size="14" font-weight="400" fill="#e5edff">диагностика → запчасти → согласование → ремонт → рекомендации</text>
    </g>
  </g>
</svg>
